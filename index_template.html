<!DOCTYPE html>
<html>
<head>
    <title>J.T.K Birding</title>
    <link rel="stylesheet" href="style.css">
    <link rel = "icon" href = "Props/J.T.K_Birding_Favicon.png">
</head>

<body>
<input type="text" id="search" placeholder=" Search Birds..." class="search_bar">
<div style = "text-align:center;">
<nav>
    <a href = "about-us.html" class = "about_us_link">About Us</a>
    </nav>
    </div>
    <div class = "logo_box">
    <img src = "Props/J.T.K_Birding_Favicon.png"
     class = "logo">
    <h1 class = "index_heading">J.T.K Birding</h1>
    </div>
    <p>Birds documented: {{BIRD_COUNT}} and counting</p>
    <div class = "index_layout">
         <div class = "bird_list">
<h2 style = "font-weight:normal;">Browse Birds</h2>
    <ul>
        {{BIRD_LIST}}
    </ul>
</div>
<div>
<button id = "random-bird" class = "random_button">Random Bird</button>
</div>
<div class = "bird_of_the_day"">
    <figure>
    <h2 style = "text-decoration: underline; font-weight:normal;">Bird of the Day</h2>
    <h3 style = "font-weight:normal;"><a href = "birds/{{BOD_FILENAME}}">{{BIRD_OF_THE_DAY}}</a></h3>
    <a href = "birds/{{BOD_FILENAME}}">
    <img src = "Images/{{BOD_IMAGE}}"
         class = "bird_of_the_day_image">
         </a>
         </figure>
         </div>
</div>
<script>
const search = document.getElementById("search")
const birds = document.querySelectorAll(".bird")

search.addEventListener("input", function() {
const text = search.value.toLowerCase();
birds.forEach(function(bird) {
const name = bird.textContent.toLowerCase();
if (name.includes(text)) {
   bird.style.display = "";
  } else {
  bird.style.display = "none";
  }
});

 });
 

const birdLinks = document.querySelectorAll(".bird a");

document.getElementById("random-bird").addEventListener("click", function() {
    const randomBird = birdLinks[Math.floor(Math.random() * birdLinks.length)];
    window.location.href = randomBird.href;
});
</script>

</body>
</html>
